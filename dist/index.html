<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#204c3d"><meta name="description" content="映库影视资源工作台：发现高分电影与剧集，比较资源，管理下载。">
  <title>映库 CineVault · 影视资源工作台</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/source-search.css">
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#discover" aria-label="映库首页"><span class="brand-mark">映</span><span>映库<small>CINEVAULT</small></span></a>
    <div class="workspace-label">我的工作台</div>
    <nav aria-label="主导航">
      <a href="#discover" data-nav="discover"><i data-icon="compass"></i>资源发现</a>
      <a href="#sources" data-nav="sources"><i data-icon="search"></i>多来源检索</a>
      <a href="#compare" data-nav="compare"><i data-icon="compare"></i>内容比较<span class="nav-count" id="compare-count">0</span></a>
      <a href="#downloads" data-nav="downloads"><i data-icon="download"></i>下载任务<span class="nav-count" id="task-count">0</span></a>
      <div class="nav-divider"></div>
      <a href="#settings" data-nav="settings"><i data-icon="settings"></i>目录与设置</a>
    </nav>
    <div class="sidebar-bottom">
      <div class="collection-note"><i data-icon="film"></i><strong>好电影，慢慢收藏。</strong><p>把喜欢的故事，留在身边。</p></div>
      <button class="service-card" id="service-button"><span class="status-dot"></span><span id="service-text">交互演示模式<small>连接本地服务以开始下载</small></span><i data-icon="chevron"></i></button>
      <div class="sidebar-footer"><span class="avatar">A</span><span>我的私人影库<small>Personal workspace</small></span><button class="icon-btn" data-action="help" aria-label="使用帮助"><i data-icon="help"></i></button></div>
    </div>
  </aside>
  <div class="main-shell">
    <header class="topbar"><div class="breadcrumb"><button class="icon-btn mobile-menu" id="mobile-menu" aria-label="展开导航"><i data-icon="menu"></i></button>工作台 <span>/</span> <strong id="breadcrumb-current">资源发现</strong></div><div class="topbar-right"><span class="private-label"><i data-icon="lock"></i>私人工作空间</span><button class="icon-btn" data-action="help" aria-label="使用帮助"><i data-icon="help"></i></button><a class="icon-btn" href="#settings" aria-label="设置"><i data-icon="settings"></i></a><span class="avatar small">A</span></div></header>
    <main id="app" tabindex="-1"></main>
    <footer class="page-footer"><span>映库 CineVault <span class="footer-dot">·</span> 让收藏更有条理</span><span id="footer-mode">示例内容 · 评分与资源仅用于交互演示</span></footer>
  </div>
  <div id="compare-dock"></div>
  <div id="overlay-root"></div>
  <div id="toasts" role="status" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body></html>
